<text x='70' y='876' font-family='Microsoft YaHei, sans-serif' font-size='23' fill='#334155'>调节余量：离地 16–20 cm；俯角 35–50°。支架抬高量需扣除底板离地高度及镜头安装偏置。</text>
<text x='70' y='918' font-family='Microsoft YaHei, sans-serif' font-size='23' fill='#334155'>先看清前方约 30–50 cm 的道路和边界；画面底部不一定能同时容纳整条 50 cm 宽车道。</text>
<text x='55' y='985' font-family='Microsoft YaHei, sans-serif' font-size='20' fill='#64748b'>示意图非加工图；未表示镜头完整视场，安装尺寸与清晰度须以实物确认。</text>
